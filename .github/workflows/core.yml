name: Verify core and Kotlin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        host: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build desktop JAR and compile Android and desktop tests
        run: bash ./gradlew --no-daemon :app:desktopJar :app:compileDebugKotlinAndroid :app:compileTestKotlinDesktop -PrprobeAbi=x86_64
